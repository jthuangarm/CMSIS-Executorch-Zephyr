# Keil Studio builds and runs the native Zephyr ExecuTorch application through west.
solution:
  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: GCC

  packs:
    - pack: ARM::Cortex_DFP
    - pack: ARM::SSE_320_BSP@^2.0.0

  target-types:
    - type: SSE-320-U85
      board: SSE-320
      device: SSE-320-FVP
      target-set:
        - set:
          images:
            - project-context: cmsis-executorch.Debug
          debugger:
            name: Arm-FVP
            model: FVP_Corstone_SSE-320
            config-file: board/Corstone-320/fvp_config.txt
            args: "--simlimit 60"

  build-types:
    - type: Debug
      debug: on
      optimize: debug
      west-defs:
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y

  projects:
    - west:
        project-id: cmsis-executorch
        app-path: ./zephyr_native_app
        board: mps4/corstone320/fvp
        west-defs:
          - ET_PTE_FILE_PATH: ../../../../ai_layer/model.pte
      for-context:
        - +SSE-320-U85
