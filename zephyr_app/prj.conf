# Enable C++17 and the GNU C++ standard library for ExecuTorch.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Use Newlib and enable floating-point formatting in printf.
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Main thread stack: 16 KiB.
CONFIG_MAIN_STACK_SIZE=16384
# Kernel heap: 4 KiB, used by k_malloc and related kernel allocations.
# Separate from the ExecuTorch static memory pools.
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Enable the Ethos-U driver with the U85 256-MAC configuration.
# Must match the Vela model compilation settings and FVP configuration.
CONFIG_ETHOS_U=y
CONFIG_ETHOS_U85_256=y

# Disable UART and route console output through FVP semihosting.
CONFIG_SERIAL=n
CONFIG_SEMIHOST=y
CONFIG_SEMIHOST_CONSOLE=y
